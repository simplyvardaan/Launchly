<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="kuro-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#090A0F"/>
      <stop offset=".4" stop-color="#0E121B"/>
      <stop offset="1" stop-color="#141B2D"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00F0FF"/>
      <stop offset="1" stop-color="#7000FF"/>
    </linearGradient>
    <radialGradient id="mesh" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#7000FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#090A0F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#kuro-bg)"/>
  <rect width="1200" height="800" fill="url(#mesh)"/>

  <!-- Grid overlay -->
  <path d="M 0 100 L 1200 100 M 0 300 L 1200 300 M 0 500 L 1200 500 M 0 700 L 1200 700 M 300 0 L 300 800 M 600 0 L 600 800 M 900 0 L 900 800" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Top bar -->
  <text x="80" y="70" fill="#00F0FF" font-family="'Space Mono', monospace, sans-serif" font-size="18" font-weight="700" letter-spacing="4">KURO STUDIO // ARCHIVE 2026</text>
  <circle cx="850" cy="65" r="5" fill="#00FF66"/>
  <text x="865" y="70" fill="#E2E8F0" font-family="'Space Mono', monospace, sans-serif" font-size="14" letter-spacing="2">AVAILABLE FOR SELECT WORK</text>

  <!-- Left: Main Headings -->
  <text x="80" y="190" fill="#94A3B8" font-family="'Space Mono', monospace, sans-serif" font-size="20" font-weight="700" letter-spacing="5">PRODUCT &amp; CREATIVE TECHNOLOGIST</text>
  <text x="80" y="285" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="82" font-weight="800" letter-spacing="-1">Designing interfaces</text>
  <text x="80" y="375" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="82" font-weight="800" letter-spacing="-1">that redefine utility.</text>
  <text x="80" y="445" fill="#94A3B8" font-family="'Space Grotesk', sans-serif" font-size="24" max-width="600">Multi-disciplinary design director partnering with high-velocity venture teams.</text>

  <!-- Action CTA -->
  <rect x="80" y="495" width="220" height="62" rx="14" fill="#00F0FF"/>
  <text x="120" y="534" fill="#090A0F" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800" letter-spacing="1">VIEW ARCHIVE ↗</text>

  <rect x="320" y="495" width="200" height="62" rx="14" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="365" y="534" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">READ ABOUT</text>

  <!-- Right: Holographic Card Stacks -->
  <g transform="translate(680, 160)">
    <!-- Back card -->
    <rect x="50" y="20" width="400" height="420" rx="24" fill="#101726" stroke="#1E293B" stroke-width="2" opacity="0.6"/>
    
    <!-- Main Card -->
    <rect x="0" y="0" width="410" height="420" rx="24" fill="#0F172A" stroke="url(#cyan-glow)" stroke-width="2"/>
    
    <!-- Card header -->
    <text x="36" y="50" fill="#00F0FF" font-family="'Space Mono', monospace" font-size="13" letter-spacing="3">01 // FEATURED CASE STUDY</text>
    <text x="36" y="90" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="30" font-weight="800">Vortex Design System</text>
    <text x="36" y="125" fill="#94A3B8" font-family="'Space Grotesk', sans-serif" font-size="16">Multi-brand design architecture powering 14 core apps.</text>

    <!-- Visual metric graphic -->
    <rect x="36" y="155" width="338" height="150" rx="16" fill="#090D16" stroke="#1E293B" stroke-width="1"/>
    <!-- Waveform / metric -->
    <path d="M 56 240 Q 110 180, 160 220 T 260 190 T 350 240" fill="none" stroke="#00F0FF" stroke-width="4" stroke-linecap="round"/>
    <circle cx="260" cy="190" r="7" fill="#00F0FF"/>
    <circle cx="260" cy="190" r="14" fill="#00F0FF" opacity="0.3"/>
    <text x="56" y="195" fill="#64748B" font-family="'Space Mono', monospace" font-size="11">ADOPTION VELOCITY</text>
    <text x="56" y="222" fill="#00F0FF" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="800">99.4%</text>

    <!-- Card tags -->
    <rect x="36" y="335" width="105" height="32" rx="8" fill="#1E293B"/>
    <text x="50" y="356" fill="#E2E8F0" font-family="'Space Mono', monospace" font-size="11">Design System</text>

    <rect x="150" y="335" width="85" height="32" rx="8" fill="#1E293B"/>
    <text x="165" y="356" fill="#E2E8F0" font-family="'Space Mono', monospace" font-size="11">Next.js 16</text>

    <rect x="245" y="335" width="110" height="32" rx="8" fill="#1E293B"/>
    <text x="258" y="356" fill="#E2E8F0" font-family="'Space Mono', monospace" font-size="11">WebGL Shaders</text>

    <text x="36" y="395" fill="#00F0FF" font-family="'Space Mono', monospace" font-size="12" font-weight="700">EXPLORE CASE STUDY ➔</text>
  </g>

  <!-- Bottom client recognition ticker -->
  <line x1="80" y1="670" x2="1120" y2="670" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="80" y="730" fill="#64748B" font-family="'Space Mono', monospace" font-size="14" letter-spacing="3">TRUSTED BY</text>
  <text x="230" y="730" fill="#E2E8F0" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800" letter-spacing="3">VERCEL</text>
  <text x="390" y="730" fill="#E2E8F0" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800" letter-spacing="3">LINEAR</text>
  <text x="540" y="730" fill="#E2E8F0" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800" letter-spacing="3">RAYCAST</text>
  <text x="700" y="730" fill="#E2E8F0" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800" letter-spacing="3">CHRONICLE</text>
  <text x="890" y="730" fill="#00F0FF" font-family="'Space Mono', monospace" font-size="15" letter-spacing="2">3× FWA · 2× AWWWARDS SOTD</text>
</svg>
